name: Keep AC-Kahoot Render Awake 24/7

on:
  schedule:
    # Run every 10 minutes (Render free instance sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Pinging https://ac-kahoot.onrender.com to keep it awake..."
          curl -s -f -m 45 "https://ac-kahoot.onrender.com" > /dev/null || true
          curl -s -f -m 45 "https://ac-kahoot.onrender.com/api/quizzes" > /dev/null || true
          echo "Render service successfully pinged and awake!"
